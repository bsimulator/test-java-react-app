name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Analyze Code
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          chmod +x analyzer.sh
          ./analyzer.sh diff.txt > review.txt
          
      - name: Post Review
        run: |
          REVIEW=$(cat review.txt)
          
          BODY=$(cat << EOF
          ## 🤖 Automated Code Review
          
          \`\`\`
          $REVIEW
          \`\`\`
          
          ---
          **Checks:** Security • Java Best Practices • React Patterns • Code Quality • Performance
          EOF
          )
          
          echo "$BODY" > comment.txt
          
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review Pull Request
    
    steps:
      - name: Checkout code
        run: |
          git clone --depth=50 https://github.com/${{ github.repository }}.git .
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git checkout ${{ github.event.pull_request.head.ref }}
      
      - name: Get PR diff and analyze
        id: analyze
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt
          
          echo "Files changed:"
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD
          
          chmod +x ./analyzer.sh
          ./analyzer.sh pr_diff.txt > analysis_result.txt
          cat analysis_result.txt
      
      - name: Post review comment
        run: |
          COMMENT=$(cat << 'EOF'
          ## 🔍 Automated Code Review Results
          
          $(cat analysis_result.txt)
          
          ---
          
          ### 📋 Review Summary
          
          This automated review checks for:
          - 🔒 Security issues (hardcoded secrets, dangerous functions)
          - ☕ Java best practices (logging, resource management, NPE risks)
          - ⚛️ React patterns (hooks, state management, performance)
          - 📊 Code quality (debug statements, deprecated methods)
          - ⚡ Performance issues (inefficient queries, nested loops)
          
          *This is an automated analysis. Please review the findings and address any critical issues.*
          EOF
          )
          
          # Escape for JSON
          COMMENT_ESCAPED=$(echo "$COMMENT" | jq -Rs .)
          
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "{\"body\": $COMMENT_ESCAPED}"

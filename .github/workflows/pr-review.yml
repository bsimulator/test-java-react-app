name: Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    name: Review Pull Request
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt
          echo "Files changed:"
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD
      
      - name: Run Code Analyzer
        id: analyze
        run: |
          chmod +x ./analyzer.sh
          ./analyzer.sh pr_diff.txt > analysis_result.txt
          cat analysis_result.txt
      
      - name: Post Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('analysis_result.txt', 'utf8');
            
            const comment = `## 🔍 Automated Code Review Results
            
            ${analysis}
            
            ---
            
            ### 📋 Review Summary
            
            This automated review checks for:
            - 🔒 Security issues (hardcoded secrets, dangerous functions)
            - ☕ Java best practices (logging, resource management, NPE risks)
            - ⚛️ React patterns (hooks, state management, performance)
            - 📊 Code quality (debug statements, deprecated methods)
            - ⚡ Performance issues (inefficient queries, nested loops)
            
            *This is an automated analysis. Please review the findings and address any critical issues.*
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    name: Automated Code Review
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt
          echo "Files changed:"
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD
      
      - name: Run Code Analyzer
        run: |
          node ./analyzer.js pr_diff.txt > analysis_result.txt
          cat analysis_result.txt

      - name: Post Review Comment
        run: |
          REVIEW_BODY=$(cat analysis_result.txt)
          
          gh pr comment ${{ github.event.pull_request.number }} --body "$REVIEW_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
